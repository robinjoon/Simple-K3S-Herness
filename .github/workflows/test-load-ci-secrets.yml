name: Test load-ci-secrets Action

on:
  pull_request:
    paths:
      - .github/actions/load-ci-secrets/**
      - .github/workflows/test-load-ci-secrets.yml
  push:
    branches: [main]
    paths:
      - .github/actions/load-ci-secrets/**
      - .github/workflows/test-load-ci-secrets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .github/actions/load-ci-secrets
    steps:
      - name: Check out the harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the distributable Action
        run: npm run build
      - name: Verify the committed bundle is current
        run: |
          git diff --exit-code -- dist
          if [ -n "$(git status --porcelain --untracked-files=all -- dist)" ]; then
            git status --short --untracked-files=all -- dist
            exit 1
          fi
      - name: Test with dummy credentials only
        run: npm test
