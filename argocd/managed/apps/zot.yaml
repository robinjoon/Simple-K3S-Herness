apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://zotregistry.dev/helm-charts
    chart: zot
    targetRevision: 0.1.122
    helm:
      values: |
        replicaCount: 1

        image:
          repository: ghcr.io/project-zot/zot
          tag: v2.1.20
          pullPolicy: IfNotPresent

        service:
          type: ClusterIP
          port: 5000

        ingress:
          enabled: true
          className: traefik
          pathtype: Prefix
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
          hosts:
            - host: registry.homelab.robinjoon.xyz
              paths:
                - path: /
          tls:
            - secretName: zot-tls
              hosts:
                - registry.homelab.robinjoon.xyz

        persistence: true
        pvc:
          create: true
          name: zot-pvc
          accessModes:
            - ReadWriteOnce
          storage: 20Gi
          storageClassName: local-path

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi

        mountConfig: true
        configFiles:
          config.json: |-
            {
              "distSpecVersion": "1.1.1",
              "storage": {
                "rootDirectory": "/var/lib/registry/data",
                "commit": true,
                "dedupe": true,
                "gc": true,
                "gcDelay": "24h",
                "gcInterval": "24h",
                "retention": {
                  "dryRun": false,
                  "delay": "168h",
                  "policies": [
                    {
                      "repositories": ["**"],
                      "deleteReferrers": false,
                      "deleteUntagged": true,
                      "keepTags": [
                        {
                          "patterns": [".*"]
                        }
                      ]
                    }
                  ]
                }
              },
              "http": {
                "address": "0.0.0.0",
                "port": "5000",
                "realm": "zot",
                "readTimeout": "15m",
                "writeTimeout": "15m",
                "compat": ["docker2s2"],
                "auth": {
                  "htpasswd": {
                    "path": "/etc/zot/auth/htpasswd"
                  },
                  "failDelay": 5,
                  "secureSession": true
                },
                "accessControl": {
                  "repositories": {
                    "**": {
                      "policies": [
                        {
                          "users": ["admin"],
                          "actions": ["read", "create", "update", "delete"]
                        }
                      ],
                      "defaultPolicy": []
                    }
                  }
                }
              },
              "log": {
                "level": "info",
                "audit": "/var/lib/registry/zot-audit.log"
              },
              "extensions": {
                "metrics": {
                  "enable": false
                },
                "scrub": {
                  "enable": true,
                  "interval": "24h"
                },
                "search": {
                  "enable": true
                },
                "ui": {
                  "enable": true
                }
              }
            }

        mountSecret: false
        secretFiles: {}
        externalSecrets:
          - secretName: zot-auth
            mountPath: /etc/zot/auth
  destination:
    server: https://kubernetes.default.svc
    namespace: registry-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
