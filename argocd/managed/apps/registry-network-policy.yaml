apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: registry-network-policy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/robinjoon/Simple-K3S-Herness.git
    targetRevision: main
    path: infrastructure/registry
  destination:
    server: https://kubernetes.default.svc
    namespace: registry-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
