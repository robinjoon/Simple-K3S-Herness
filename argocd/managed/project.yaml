apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab-workloads
  namespace: argocd
spec:
  description: Project for homelab AI workloads
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: "Namespace"
  namespaceResourceWhitelist:
    - group: "apps"
      kind: "Deployment"
    - group: "apps"
      kind: "StatefulSet"
    - group: "apps"
      kind: "DaemonSet"
    - group: "apps"
      kind: "ReplicaSet"
    - group: "batch"
      kind: "CronJob"
    - group: "batch"
      kind: "Job"
    - group: ""
      kind: "Pod"
    - group: ""
      kind: "Secret"
    - group: ""
      kind: "Service"
    - group: ""
      kind: "ConfigMap"
    - group: ""
      kind: "PersistentVolumeClaim"
    - group: ""
      kind: "ServiceAccount"
    - group: "networking.k8s.io"
      kind: "Ingress"
    - group: "networking.k8s.io"
      kind: "NetworkPolicy"
    - group: "cert-manager.io"
      kind: "Certificate"
    - group: "acme.cert-manager.io"
      kind: "Order"
    - group: "acme.cert-manager.io"
      kind: "Challenge"
    - group: "rbac.authorization.k8s.io"
      kind: "Role"
    - group: "rbac.authorization.k8s.io"
      kind: "RoleBinding"
    - group: "autoscaling"
      kind: "HorizontalPodAutoscaler"
    - group: "policy"
      kind: "PodDisruptionBudget"
    - group: "postgresql.cnpg.io"
      kind: "Cluster"
    - group: "postgresql.cnpg.io"
      kind: "Pooler"
    - group: "postgresql.cnpg.io"
      kind: "ScheduledBackup"
    - group: "postgresql.cnpg.io"
      kind: "Database"
