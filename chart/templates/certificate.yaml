{{- $platform := index .Values "platform" | default dict }}
{{- $certManager := index $platform "certManager" | default dict }}
{{- $issuerRef := index $certManager "issuerRef" | default dict }}
{{- range .Values.ingresses }}
{{- if and .tls (eq .tls.mode "cert-manager") }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $.Values.metadata.name }}-{{ .name }}
  namespace: {{ $.Values.metadata.namespace }}
spec:
  secretName: {{ $.Values.metadata.name }}-{{ .name }}-tls
  dnsNames:
  {{- range .rules }}
    - {{ .host }}
  {{- end }}
  issuerRef:
    name: {{ index $issuerRef "name" }}
    kind: {{ index $issuerRef "kind" }}
{{- end }}
{{- end }}
