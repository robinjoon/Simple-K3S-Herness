{{- range .Values.ingresses }}
{{- if and .tls (eq .tls.mode "cert-manager") }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $.Values.metadata.name }}-{{ .name }}
  namespace: {{ $.Values.metadata.namespace }}
spec:
  secretName: {{ $.Values.metadata.name }}-{{ .name }}-tls
  dnsNames:
  {{- range .rules }}
    - {{ .host }}
  {{- end }}
  issuerRef:
    # Here we'd ideally read from platform defaults, but hardcoding for MVP
    name: letsencrypt-prod
    kind: ClusterIssuer
{{- end }}
{{- end }}
