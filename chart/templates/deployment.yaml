{{- if eq .Values.workload.kind "deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.metadata.name }}
  namespace: {{ .Values.metadata.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.metadata.name }}
spec:
  replicas: {{ if hasKey .Values.workload "replicas" }}{{ .Values.workload.replicas }}{{ else }}1{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.metadata.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.metadata.name }}
    spec:
      {{- with .Values.workload.imagePullSecrets }}
      imagePullSecrets:
      {{- range . }}
        - name: {{ .name }}
      {{- end }}
      {{- end }}
      containers:
      {{- range .Values.workload.containers }}
        - name: {{ .name }}
          image: "{{ .image.repository }}:{{ .image.tag }}"
          {{- if .ports }}
          ports:
          {{- range .ports }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
          {{- end }}
          {{- end }}
          {{- if or $.Values.database .env }}
          env:
          {{- if $.Values.database }}
            - name: DB_HOST
              value: {{ required "platform.database.host is required when database is declared" $.Values.platform.database.host | quote }}
          {{- end }}
          {{- range .env }}
            {{- if and $.Values.database (eq .name "DB_HOST") }}
              {{- fail "DB_HOST is managed by the platform when database is declared" }}
            {{- end }}
            {{- if and $.Values.database .secretKeyRef (eq .secretKeyRef.name "shared-db-app") (not (has .secretKeyRef.key (list "port" "username" "password"))) }}
              {{- fail "shared-db-app may only supply port, username, and password to database workloads" }}
            {{- end }}
            - name: {{ .name }}
              {{- if .value }}
              value: {{ .value | quote }}
              {{- end }}
              {{- if .secretKeyRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretKeyRef.name }}
                  key: {{ .secretKeyRef.key }}
              {{- end }}
              {{- if .configMapKeyRef }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $.Values.metadata.name }}-{{ .configMapKeyRef.name }}
                  key: {{ .configMapKeyRef.key }}
              {{- end }}
          {{- end }}
          {{- end }}
          {{- if .envFrom }}
          envFrom:
          {{- range .envFrom }}
            {{- if and $.Values.database .secretRef (eq .secretRef.name "shared-db-app") }}
              {{- fail "shared-db-app may only supply port, username, and password to database workloads" }}
            {{- end }}
            {{- if .configMapRef }}
            - configMapRef:
                name: {{ $.Values.metadata.name }}-{{ .configMapRef.name }}
            {{- end }}
            {{- if .secretRef }}
            - secretRef:
                name: {{ .secretRef.name }}
            {{- end }}
          {{- end }}
          {{- end }}
          {{- if .volumeMounts }}
          volumeMounts:
          {{- range .volumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              {{- if .subPath }}
              subPath: {{ .subPath }}
              {{- end }}
              {{- if hasKey . "readOnly" }}
              readOnly: {{ .readOnly }}
              {{- end }}
          {{- end }}
          {{- end }}
      {{- end }}
      {{- if .Values.workload.volumes }}
      volumes:
      {{- range .Values.workload.volumes }}
        {{- if and $.Values.database .secret (eq .secret.secretName "shared-db-app") }}
          {{- fail "shared-db-app may only supply port, username, and password to database workloads" }}
        {{- end }}
        - name: {{ .name }}
          {{- if .configMap }}
          configMap:
            name: {{ $.Values.metadata.name }}-{{ .configMap.name }}
          {{- end }}
          {{- if .secret }}
          secret:
            secretName: {{ .secret.secretName }}
          {{- end }}
      {{- end }}
      {{- end }}
{{- end }}
